name: nusa_cosrent
description: "Mobile rental cosplay marketplace inspired by CosplayNusa."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  intl: ^0.20.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/