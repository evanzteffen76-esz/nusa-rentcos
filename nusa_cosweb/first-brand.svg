<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120" style="background-color: transparent;">
  <defs>
    <!-- Gradient Background Badge -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo-600 -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Pink-500 -->
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Base Shield / Badge -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#primaryGradient)" />
    
    <!-- Hanger Contour (Rental Theme) -->
    <path d="M 50 25 C 45 25 45 18 50 18 C 55 18 55 25 50 25 C 32 38 22 42 20 48 L 80 48 C 78 42 68 38 50 25 Z" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    
    <!-- Kitsune Mask / Cosplay Symbol -->
    <!-- Mask Base -->
    <path d="M 30 40 L 50 82 L 70 40 C 70 40 60 35 50 35 C 40 35 30 40 30 40 Z" fill="#FFFFFF" />
    <!-- Ears -->
    <path d="M 30 40 L 22 24 L 38 33 Z" fill="#FFFFFF" />
    <path d="M 70 40 L 78 24 L 62 33 Z" fill="#FFFFFF" />
    <path d="M 31 38 L 26 28 L 36 34 Z" fill="#EC4899" />
    <path d="M 69 38 L 74 28 L 64 34 Z" fill="#EC4899" />
    <!-- Eye Details -->
    <path d="M 36 48 C 40 45 44 48 44 48 C 44 48 40 51 36 48 Z" fill="#1E1B4B" />
    <path d="M 64 48 C 60 45 56 48 56 48 C 56 48 60 51 64 48 Z" fill="#1E1B4B" />
    <!-- Red Facial Markings -->
    <path d="M 50 48 L 47 55 L 53 55 Z" fill="#EF4444" />
    <path d="M 33 53 C 30 55 32 58 35 56 Z" fill="#EF4444" />
    <path d="M 67 53 C 70 55 68 58 65 56 Z" fill="#EF4444" />
  </g>

  <!-- Brand Name Text -->
  <text x="130" y="58" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#1E1B4B" letter-spacing="-0.5">
    NUSA<tspan fill="url(#accentGradient)">COSPLAY</tspan>
  </text>
  
  <!-- Tagline Text -->
  <text x="132" y="86" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#6B7280" letter-spacing="3">
    RENTAL &amp; COSTUME
  </text>
</svg>
